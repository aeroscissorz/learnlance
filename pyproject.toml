[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "learnlance"
version = "0.2.0"
description = "Turn what AI coding agents build into a growing personal knowledge graph."
readme = "README.md"
# 3.10+: the codebase uses PEP 604 (`X | None`) annotations throughout.
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "aeroscissorz" }]
keywords = [
    "ai", "agents", "learning", "knowledge-graph", "cli", "hooks",
    "claude-code", "cursor", "copilot", "gemini", "kiro", "antigravity",
]
dependencies = []  # stdlib only, on purpose

classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
    "Topic :: Education",
]

[project.urls]
Homepage = "https://github.com/aeroscissorz/learnlance"
Repository = "https://github.com/aeroscissorz/learnlance"
Issues = "https://github.com/aeroscissorz/learnlance/issues"

[project.optional-dependencies]
# The package itself stays stdlib-only; this is for running the test suite.
dev = ["pytest>=8"]

[project.scripts]
learnlance = "learnlance.cli:main"

[tool.setuptools]
packages = ["learnlance"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# tests/ is on the path so the suite can import its own conftest helpers by name.
pythonpath = [".", "tests"]
addopts = "-q --strict-markers"
