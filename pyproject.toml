[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "learnlance"
version = "0.1.0"
description = "Turn what Claude Code builds into a growing personal knowledge graph."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "aeroscissorz" }]
keywords = ["claude", "claude-code", "learning", "knowledge-graph", "cli", "hooks"]
dependencies = []  # stdlib only, on purpose

classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
    "Topic :: Education",
]

[project.urls]
Homepage = "https://github.com/aeroscissorz/learnlance"
Repository = "https://github.com/aeroscissorz/learnlance"
Issues = "https://github.com/aeroscissorz/learnlance/issues"

[project.scripts]
learnlance = "learnlance.cli:main"

[tool.setuptools]
packages = ["learnlance"]
