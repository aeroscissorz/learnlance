name: Publish to PyPI

# Silent releases: every push to main builds and publishes a new version.
# No tags, no manual version bump — the patch number is the CI run number.
on:
  push:
    branches: [main]
  workflow_dispatch: {}  # allow manual runs from the Actions tab too

permissions:
  contents: read

# If you push twice quickly, cancel the older in-flight run.
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  pypi-publish:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest
    permissions:
      id-token: write # REQUIRED for PyPI Trusted Publishing (OIDC)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # Version = <major.minor from pyproject> . <CI run number>
      # e.g. pyproject says 0.1.0 and this is run #7  ->  0.1.7
      # Bump the major/minor in pyproject.toml whenever you want (0.2.x, 1.0.x);
      # the patch is always automatic and strictly increasing, so PyPI never
      # rejects a duplicate.
      - name: Compute silent version
        run: |
          BASE="$(grep -E '^version' pyproject.toml | head -1 | sed -E 's/.*"([0-9]+\.[0-9]+).*"/\1/')"
          VERSION="${BASE}.${{ github.run_number }}"
          echo "Publishing version: $VERSION"
          sed -i -E "s/^version = \".*\"/version = \"${VERSION}\"/" pyproject.toml
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Summary
        run: echo "Published learnlance $VERSION to PyPI 🎉" >> "$GITHUB_STEP_SUMMARY"
