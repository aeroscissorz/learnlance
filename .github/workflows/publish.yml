name: Publish to PyPI

# Triggers when you push a version tag like v0.1.1
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  pypi-publish:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest
    permissions:
      id-token: write # REQUIRED for PyPI Trusted Publishing (OIDC)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # Safety: refuse to publish if the pushed tag doesn't match the version
      # declared in pyproject.toml (prevents accidental mismatched releases).
      - name: Verify tag matches pyproject version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VER="$(grep -E '^version' pyproject.toml | head -1 | sed -E 's/.*"(.*)".*/\1/')"
          echo "git tag = $TAG   pyproject.toml = $VER"
          if [ "$TAG" != "$VER" ]; then
            echo "::error::Tag v$TAG does not match pyproject version $VER. Bump the version first."
            exit 1
          fi

      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
