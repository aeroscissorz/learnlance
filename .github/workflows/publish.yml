name: Publish to PyPI

# Publishing is GATED. A normal push to main no longer releases.
# To cut a release either:
#   * include the token  [release]  in the pushed commit message, or
#   * run this workflow manually from the Actions tab (workflow_dispatch).
on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  pypi-publish:
    name: Build and publish to PyPI
    # Only proceed on a manual run or an explicit opt-in commit.
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[release]')
    runs-on: ubuntu-latest
    permissions:
      id-token: write # REQUIRED for PyPI Trusted Publishing (OIDC)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # Version = <major.minor from pyproject> . <CI run number>, so it always
      # increases and PyPI never rejects a duplicate.
      - name: Compute release version
        run: |
          BASE="$(grep -E '^version' pyproject.toml | head -1 | sed -E 's/.*"([0-9]+\.[0-9]+).*"/\1/')"
          VERSION="${BASE}.${{ github.run_number }}"
          echo "Publishing version: $VERSION"
          sed -i -E "s/^version = \".*\"/version = \"${VERSION}\"/" pyproject.toml
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Summary
        run: echo "Published learnlance $VERSION to PyPI" >> "$GITHUB_STEP_SUMMARY"
