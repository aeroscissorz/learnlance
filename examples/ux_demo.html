<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LearnLance UX Demo</title>
  <style>
    :root { color-scheme: light dark; font: 16px/1.5 system-ui, sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: Canvas; color: CanvasText; }
    main { width: min(32rem, calc(100% - 2rem)); padding: 2rem; border: 1px solid color-mix(in srgb, CanvasText 20%, transparent); border-radius: 1rem; }
    button { min-height: 2.75rem; padding: 0.6rem 1rem; border: 0; border-radius: 0.5rem; background: Highlight; color: HighlightText; cursor: pointer; }
    button:focus-visible { outline: 3px solid currentColor; outline-offset: 3px; }
    #announcer { position: fixed; right: 1rem; bottom: 1rem; max-width: min(24rem, calc(100% - 2rem)); padding: 1rem; border-radius: 0.75rem; background: CanvasText; color: Canvas; box-shadow: 0 0.5rem 2rem rgb(0 0 0 / 25%); }
    [hidden] { display: none; }
  </style>
</head>
<body>
  <main>
    <h1>Save your preferences</h1>
    <p>This demo gives feedback without moving the page or interrupting the user.</p>
    <button id="save" type="button">Save preferences</button>
  </main>

  <div id="announcer" role="status" aria-live="polite" hidden>
    <span id="message">Preferences saved.</span>
    <button id="dismiss" type="button" aria-label="Dismiss notification">Dismiss</button>
  </div>

  <script>
    const save = document.querySelector('#save');
    const announcer = document.querySelector('#announcer');
    const dismiss = document.querySelector('#dismiss');
    let timer;

    function showMessage(message) {
      document.querySelector('#message').textContent = message;
      announcer.hidden = false;
      clearTimeout(timer);
      timer = setTimeout(() => { announcer.hidden = true; }, 5000);
      dismiss.focus();
    }

    save.addEventListener('click', () => showMessage('Preferences saved.'));
    dismiss.addEventListener('click', () => {
      clearTimeout(timer);
      announcer.hidden = true;
      save.focus();
    });
  </script>
</body>
</html>
